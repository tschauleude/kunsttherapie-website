name: Deploy to Strato VPS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build-frontend

      - name: QA (i18n + JS syntax)
        run: npm run qa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH (git pull)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Ohne script_stop läuft das Skript nach einem Fehler weiter und endet
          # mit dem Ergebnis des letzten Befehls. Da dieser auf "|| true" endete,
          # konnte ein fehlgeschlagenes "git pull" (etwa wegen lokal geänderter
          # Dateien auf dem Server) einen grünen Deploy melden, obwohl weiterhin
          # der alte Stand lief. Jetzt bricht das Skript beim ersten Fehler ab.
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "Stand vorher: $(git rev-parse --short HEAD)"

            # Sicherung der Datenbank, bevor irgendetwas angefasst wird.
            # sqlite3 als Kommandozeilenwerkzeug ist nicht installiert, daher
            # über das npm-Paket. VACUUM INTO liefert eine in sich stimmige
            # Kopie, auch wenn gerade geschrieben wird.
            echo "--- Schritt 1: Datenbank sichern ---"
            mkdir -p "$HOME/sicherung"
            node -e "const s=require('sqlite3');const z=process.env.HOME+'/sicherung/database-vor-deploy-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.sqlite';const db=new s.Database('database.sqlite');db.run('VACUUM INTO ?',[z],e=>{console.log(e?'Sicherung FEHLGESCHLAGEN: '+e.message:'Sicherung: '+z);db.close();process.exit(e?1:0);});"

            echo "--- Schritt 2: alte Sicherungen aufraeumen ---"
            # Aufraeumen darf den Deploy nie stoppen: Das Loeschen alter
            # Sicherungen ist Hausarbeit, kein Teil der Auslieferung. Ohne das
            # abschliessende "|| true" brach hier der gesamte Deploy ab.
            (ls -1t "$HOME"/sicherung/database-vor-deploy-*.sqlite 2>/dev/null | tail -n +15 | while read -r alt; do rm -f "$alt"; done) || true

            echo "--- Schritt 3: generierte Dateien zuruecksetzen ---"
            # Beim Speichern im Admin-Panel schreibt der Server diese Dateien neu.
            # Sie stehen unter Versionskontrolle und blockieren dann "git pull".
            # Zuruecksetzen ist gefahrlos: Die Texte liegen in der Datenbank und
            # haben dort Vorrang; die Dateien entstehen beim naechsten Build neu.
            # Die Quelldatei i18n-messages-pages.js ist bewusst ausgenommen --
            # sie wird nie automatisch geschrieben, eine Aenderung daran waere echt.
            #
            # "set -e" ist hier aus: In diesem Block sind fehlschlagende Befehle
            # normal (eine Datei ist unveraendert, ein Pfad fehlt). Zwei Laeufe
            # sind genau daran gescheitert, ohne zu sagen woran. Jeder Schritt
            # meldet deshalb jetzt seinen Rueckgabewert selbst.
            set +e
            for f in assets/js/i18n-messages-*.js; do
              case "$f" in
                assets/js/i18n-messages-pages.js) continue ;;
              esac
              git checkout -- "$f" 2>/dev/null
            done
            git checkout -- assets/asset-manifest.json 2>/dev/null
            git checkout -- data/i18n-overrides.json 2>/dev/null

            REST="$(git status --porcelain --untracked-files=no)"
            STATUS_RC=$?
            set -e
            echo "git status Rueckgabewert: $STATUS_RC"

            if [ "$STATUS_RC" -ne 0 ]; then
              echo "Abbruch: 'git status' ist fehlgeschlagen - Arbeitsverzeichnis pruefen."
              exit 1
            fi

            # Alles andere bleibt ein Grund abzubrechen: lieber ein roter Deploy
            # als stillschweigend verworfene Arbeit.
            if [ -n "$REST" ]; then
              echo "Abbruch: unerwartete lokale Aenderungen auf dem Server:"
              echo "$REST"
              echo "Bitte pruefen und von Hand sichern (git stash push -u), dann Deploy erneut starten."
              exit 1
            fi
            echo "Arbeitsverzeichnis sauber."

            echo "--- Schritt 4: Stand holen ---"
            git pull origin main
            echo "--- Schritt 5: Abhaengigkeiten ---"
            npm ci --omit=dev
            echo "--- Schritt 6: Neustart ---"
            pm2 restart kunsttherapie
            echo "Stand nachher: $(git rev-parse --short HEAD)"
            sleep 3
            curl -fsS http://127.0.0.1:${PORT:-3000}/health || (pm2 logs kunsttherapie --lines 30 --nostream; exit 1)
