<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=kunsttherapie-site/index.html">
    <title>Kunsttherapie Paderborn - Preview</title>
    <meta name="description" content="Preview der Kunsttherapie Paderborn Website.">
    <style>
      :root {
        --ink: #1f1b22;
        --purple: #5b4a8f;
        --yellow: #f0c24b;
        --blue: #145668;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(680px, calc(100% - 2rem));
        border-left: 10px solid var(--yellow);
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
      }
      h1 { margin: 0 0 1rem; font-family: Georgia, serif; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; }
      p { color: rgba(255, 255, 255, 0.86); }
      a {
        display: inline-flex;
        margin-top: 1rem;
        padding: 0.9rem 1.2rem;
        background: var(--yellow);
        color: var(--ink);
        font-weight: 800;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kunsttherapie Paderborn</h1>
      <p>Weiterleitung zur Website-Preview. Falls nichts passiert, bitte den Button nutzen.</p>
      <a href="kunsttherapie-site/index.html">Preview öffnen</a>
    </main>
  </body>
</html>
